# workbuddy2api - MySQL 8.0.28 配置
#
# 为什么必须挂这个文件：
# 镜像 registry.cn-hangzhou.aliyuncs.com/jcleng/circleci-mysql:8-oracle-ram 自带的
# /etc/mysql/my.cnf 是坏的——里面的换行写成了字面量 "\n"，整份文件被当成一行，
# mysqld 启动直接报 "Found option without preceding group" 并退出。
# 挂一份正常的 my.cnf 覆盖它，容器才起得来。
#
# 顺带修掉两件事：
#   1. 原配置 datadir = /dev/shm/mysql（受 --shm-size 限制，默认只有 64MB），
#      这里不再指定 datadir，让它回落到 /var/lib/mysql，也就是 compose 里挂的
#      mysql_8 数据卷，重启不丢数据。
#   2. 原配置 character-set-server = utf8（utf8 是 utf8mb3 的别名），管理后台的表里
#      有 emoji 字段，改成 utf8mb4。

[mysqld]
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
init-connect = "SET NAMES utf8mb4"

# pymysql 走 caching_sha2_password 需要 cryptography（已在 requirements.txt 里），
# 这里直接换成 native，省掉一次额外握手。
default_authentication_plugin = mysql_native_password

# 内存：按总内存的 60%~70% 给 InnoDB。宿主机内存小的时候往下调。
innodb_buffer_pool_size = 1G
innodb_log_file_size = 256M
innodb_flush_log_at_trx_commit = 1
innodb_flush_method = O_DIRECT

# 管理后台 SQLAlchemy 连接池是 pool_size=20 + max_overflow=40，
# 150 偏紧，多起几个进程就不够用了。
max_connections = 500
thread_cache_size = 50

# MySQL 8 默认 lower_case_table_names=0，表名区分大小写；
# 这里保持 0（Linux 默认），不要和已有数据卷混用 1。
sql_mode = STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION

[client]
default-character-set = utf8mb4
